# Haalt elke dag de gezondheidsindex (basis 2013 = 100) op bij Statbel en bewaart nieuwe maanden in index.json.
name: Statbel gezondheidsindex
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Index ophalen bij Statbel
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          # be.STAT API van Statbel (JSON, laatste 13 maanden): gezondheidsindex basis 2013 = 100
          U = 'https://bestat.statbel.fgov.be/bestat/api/views/e8fad1c0-5270-4d62-9118-0999ee8cb323/result/JSON'
          req = urllib.request.Request(U, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) Chrome/124.0 Safari/537.36', 'Accept': 'application/json'})
          raw = urllib.request.urlopen(req, timeout=120).read().decode('utf-8-sig', 'replace')
          try: facts = json.loads(raw)['facts']
          except Exception: raise SystemExit('Geen JSON van Statbel ontvangen: ' + raw[:200])
          new = {}
          for f in facts:
              if f.get('Level 1') != 'Health index' or not str(f.get('Base year', '')).startswith('2013'): continue
              d = datetime.datetime.strptime(f['Month'], '%B %Y')
              new[f"{d.year}-{d.month:02d}"] = round(float(f['Consumer price index']), 2)
          if len(new) < 6: raise SystemExit('Te weinig indexcijfers gevonden - controleer de Statbel-API')
          for k, v in new.items():
              if not 90 < v < 300: raise SystemExit('Onverwachte waarde ' + k + ': ' + str(v))
          try: d = json.load(open('index.json'))
          except Exception: d = {}
          idx = dict(d.get('index2013', {})); before = dict(idx); idx.update(new)
          if idx != before:
              d = {'bron': 'Statbel be.STAT - gezondheidsindex, basis 2013 = 100', 'bestand': U, 'bijgewerkt': datetime.date.today().isoformat(), 'index2013': dict(sorted(idx.items()))}
              json.dump(d, open('index.json', 'w'), indent=1, ensure_ascii=False)
          print(len(new), 'maanden gelezen, laatste', max(new), '=', new[max(new)])
          PY
      - name: Opslaan als er een nieuwe maand is
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Gezondheidsindex bijgewerkt (Statbel)"
            git push
          fi
