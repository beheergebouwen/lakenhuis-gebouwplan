# Haalt elke dag de gezondheidsindex (basis 2013 = 100) op bij Statbel en bewaart nieuwe maanden in index.json.
name: Statbel gezondheidsindex
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Index ophalen bij Statbel
        run: |
          python3 - <<'PY'
          import json, io, zipfile, urllib.request, datetime
          # Statbel open data: consumptieprijsindex + gezondheidsindex, alle basisjaren (TXT in ZIP)
          U = 'https://statbel.fgov.be/sites/default/files/files/opendata/Consumptieprijsindex%20en%20gezondheidsindex/CPI%20All%20base%20years.zip'
          z = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(U, timeout=120).read()))
          txt = z.read([n for n in z.namelist() if n.lower().endswith('.txt')][0]).decode('utf-8-sig', 'replace')
          rows = [l.split('|') for l in txt.splitlines() if l.strip()]; h = rows[0]; I = {k: i for i, k in enumerate(h)}
          new = {}
          for r in rows[1:]:
              if len(r) < len(h) or r[I['NM_BASE_YR']] != '2013' or r[I['MS_HLTH_IDX']] in ('.', ''): continue
              k = f"{int(r[I['NM_YR']])}-{int(r[I['NM_MTH']]):02d}"
              if k >= '2018-01': new[k] = round(float(r[I['MS_HLTH_IDX']]), 2)
          if len(new) < 12: raise SystemExit('Te weinig indexcijfers gevonden - controleer het Statbel-bestand')
          for k, v in new.items():
              if not 90 < v < 300: raise SystemExit('Onverwachte waarde ' + k + ': ' + str(v))
          try: d = json.load(open('index.json'))
          except Exception: d = {}
          idx = dict(d.get('index2013', {})); before = dict(idx); idx.update(new)
          if idx != before:
              d = {'bron': 'Statbel open data - gezondheidsindex, basis 2013 = 100', 'bestand': U, 'bijgewerkt': datetime.date.today().isoformat(), 'index2013': dict(sorted(idx.items()))}
              json.dump(d, open('index.json', 'w'), indent=1, ensure_ascii=False)
          print(len(new), 'maanden gelezen, laatste', max(new), '=', new[max(new)])
          PY
      - name: Opslaan als er een nieuwe maand is
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Gezondheidsindex bijgewerkt (Statbel)"
            git push
          fi
